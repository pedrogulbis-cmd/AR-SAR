<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
:root{
  /* Thème clair par défaut */
  --bg:#F4F5F8; --panel:#FFFFFF; --line:#E6E7EC; --line2:#D8DAE2;
  --txt:#15171E; --muted:#6B7180; --dim:#9AA0AE;
  --gold:#E0A82E; --violet:#6D5DF0; --red:#D2493A; --green:#1E9E6A;
  --navbg:rgba(255,255,255,.92);
  --soft:#EEF0F5; --shadow:0 1px 3px rgba(16,20,40,.06),0 6px 20px rgba(16,20,40,.05);
  --display:'Bricolage Grotesque','Avenir Next',sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --tabbar:calc(62px + env(safe-area-inset-bottom));
}
html[data-theme="sombre"]{
  --bg:#0E1220; --panel:#151B2C; --line:#232B40; --line2:#2A3350;
  --txt:#E8EAF2; --muted:#8A92A8; --dim:#5A6378;
  --gold:#F5C64F; --violet:#8B7BFF; --red:#FF8A7A; --green:#7BD88F;
  --navbg:rgba(14,18,32,.92);
  --soft:#101626; --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--body);min-height:100vh;
  padding-bottom:calc(var(--tabbar) + 20px);transition:background .2s,color .2s}
header{padding:26px 18px 8px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--violet);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.15;margin-top:6px}
h1 em{font-style:normal;color:var(--gold)}
.sub{color:var(--muted);margin-top:4px;font-size:13px}
.dash{margin:14px 14px 4px;padding:18px 16px 16px;background:var(--panel);
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.bigline{display:flex;align-items:baseline;gap:10px}
.bignum{font-family:var(--display);font-size:40px;font-weight:800;color:var(--gold);line-height:1}
.saved{margin-left:auto;font-size:11.5px;color:transparent;transition:color .3s}
.saved.on{color:var(--green)}
.scopenote{color:var(--dim);font-size:11px;margin-top:4px}
.valueline{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:14px;
  border-top:1px solid var(--line)}
.valueline .lbl{color:var(--muted);font-size:13px}
.valueline .val{font-family:var(--display);font-weight:800;font-size:22px;color:var(--green);margin-left:auto}
.spentline{display:flex;align-items:center;gap:8px;margin-top:6px}
.spentline .lbl{color:var(--muted);font-size:13px}
.spentline .val{font-size:15px;font-weight:600;margin-left:auto;font-family:var(--display)}
.refreshrow{display:flex;align-items:center;gap:10px;margin-top:12px}
.refreshbtn{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line2);
  background:var(--soft);color:var(--txt);font-family:var(--body);font-size:13.5px;font-weight:600}
.refreshbtn:disabled{opacity:.55}
.refreshstatus{color:var(--dim);font-size:11.5px;margin-top:6px}
.track{height:7px;background:var(--line);border-radius:99px;margin-top:8px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .4s ease}
.fill.gold{background:linear-gradient(90deg,#F5C64F,#FFDE8A)}
.restpanel{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.resthead{font-size:11px;color:var(--dim);font-weight:700;margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.09em}
.restrow{display:flex;align-items:center;gap:10px;padding:9px 2px;font-size:14px}
.restrow input[type=checkbox]{width:18px;height:18px;accent-color:#F5C64F;flex-shrink:0}
.restrow .amt{margin-left:auto;color:var(--muted);font-weight:600;font-size:13px}
.resttotal{display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);
  margin-top:6px;padding-top:10px;font-size:13.5px;color:var(--muted)}
.resttotal .amt{margin-left:auto;color:var(--red);font-weight:800;font-family:var(--display);font-size:20px}
.tabs{display:flex;gap:8px;padding:12px 12px 0}
.tabbtn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);
  color:var(--muted);font-family:var(--display);font-weight:700;font-size:14.5px}
.tabbtn.on{background:var(--gold);border-color:var(--gold);color:#3A2A00}
.filters{display:flex;gap:8px;padding:4px 12px 0;flex-wrap:wrap}
.filters{gap:8px;padding:10px 14px 2px}
.filters select{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;color:var(--txt);font-size:13.5px;padding:11px 10px;font-family:var(--body);
  box-shadow:var(--shadow);appearance:none;-webkit-appearance:none}
main{padding:6px 12px 0;display:flex;flex-direction:column;gap:10px}
.serieshead{font-family:var(--display);font-weight:800;font-size:12px;color:var(--dim);
  padding:14px 6px 2px;letter-spacing:.1em;text-transform:uppercase}
.set{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.set.done{border-color:#F5C64F55}
.sethead{width:100%;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:15px 15px 9px;background:none;border:none;color:inherit;font-family:var(--body);text-align:left}
.code{font-family:var(--display);font-weight:700;font-size:11.5px;color:#fff;
  background:var(--violet);border-radius:6px;padding:2px 7px;letter-spacing:.03em}
.code.sv{background:#E4604F;color:#fff}
.setname{font-family:var(--display);font-weight:700;font-size:16.5px;margin-top:4px}
.setmeta{color:var(--muted);font-size:11.5px}
.setrest{font-size:11.5px;color:var(--gold);margin-top:2px}
.setrest.zero{color:var(--green)}
.setcount{font-family:var(--display);font-weight:700;font-size:19px;color:var(--dim);text-align:right}
.setcount.has{color:var(--gold)}
.setcount small{color:var(--dim);font-size:14px}
.toggletxt{color:var(--muted);font-size:11px;text-align:right}
.constellation{display:flex;flex-wrap:wrap;gap:3px;padding:0 14px 12px}
.constellation button{background:none;border:none;padding:1px;line-height:0}
.rows{padding:0 12px 14px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;
  border:1px solid var(--line);background:var(--soft)}
.row.owned{background:var(--panel);border-color:var(--gold)}
.row .starbtn{background:none;border:none;padding:2px;line-height:0;flex-shrink:0}
.thumb{width:34px;height:47px;border-radius:5px;object-fit:cover;flex-shrink:0;
  background:var(--soft);border:1px solid var(--line)}
.thumb.hide{display:none}
.cardinfo{flex:1;min-width:0;background:none;border:none;color:inherit;text-align:left;
  font-family:var(--body);padding:0;display:flex;align-items:center;gap:8px}
.cardtext{min-width:0;flex:1}
.cardname{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardmeta{font-size:11.5px;color:var(--dim)}
.cardmeta b{color:var(--muted);font-weight:600}
input{background:var(--bg);border:1px solid var(--line2);border-radius:8px;color:var(--txt);
  font-size:13.5px;padding:7px 8px;font-family:var(--body)}
input::placeholder{color:#4A5268}
input:focus{outline:2px solid #F5C64F44;outline-offset:1px}
.price{width:60px;text-align:right;flex-shrink:0}
.pricehidden{display:inline-block;color:var(--dim);font-size:13.5px;padding:7px 8px;
  border:1px dashed var(--line);border-radius:8px;letter-spacing:1px}
.nameedit{flex:1;min-width:0}
.add{background:none;border:1px dashed var(--line2);border-radius:10px;color:var(--muted);
  font-size:13.5px;padding:10px;font-family:var(--body);margin-top:2px;width:100%}
.loadbtn{background:var(--soft);border:1px solid var(--line2);border-radius:10px;color:var(--gold);
  font-size:13.5px;font-weight:600;padding:11px;font-family:var(--body);width:100%}
.loadbtn:disabled{opacity:.55}
.reset{border-color:var(--line2);color:var(--red);margin:8px 0 0}
.clearset{color:var(--red);border-color:var(--line2)}
.cntpill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:99px;padding:3px 8px;
  border:1px solid var(--line2);color:var(--dim);margin-bottom:4px}
.cntpill.on{color:#3A2A00;background:var(--gold);border-color:var(--gold)}
.set.off{opacity:.55}
.set.discover{border-style:dashed;border-color:var(--line2)}
.footnote{color:var(--muted);font-size:11.5px;text-align:center;margin:10px 0 0;padding:0 14px}
button{cursor:pointer}
svg path{transition:all .25s ease}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.muted{color:var(--muted)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--navbg);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.navbtn{padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:none;border:none;border-top:2px solid transparent;margin-top:-1px;
  color:var(--muted);font-size:11px;font-weight:600;font-family:var(--body);
  letter-spacing:.02em;transition:color .15s}
.navbtn .ic{filter:grayscale(1);opacity:.5;transition:all .15s}
.navbtn.on .ic{filter:none;opacity:1}
.navbtn .ic{font-size:21px;line-height:1}
.navbtn.on{color:var(--txt);border-top-color:var(--violet)}
.topbar{display:flex;align-items:center;gap:10px;padding:20px 16px 4px}
.tcgpick{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
  border-radius:99px;padding:8px 14px 8px 12px;font-family:var(--display);font-weight:700;
  font-size:14.5px;color:var(--txt);box-shadow:var(--shadow)}
.tcgpick .ic{font-size:16px}
.themebtn.privon{border-color:var(--violet);color:var(--violet)}
.vtag{margin-left:auto;font-size:11px;font-weight:700;color:var(--dim);
  background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:5px 9px;
  font-family:var(--display);letter-spacing:.03em}
.themebtn{margin-left:7px;background:var(--panel);border:1px solid var(--line);border-radius:99px;
  width:42px;height:42px;font-size:17px;display:flex;align-items:center;justify-content:center;
  color:var(--txt);box-shadow:var(--shadow)}
.sheet-bg{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.4);backdrop-filter:blur(2px)}
.sheet-bg[hidden]{display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:56;background:var(--panel);
  border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto}
.sheet h3{font-family:var(--display);font-size:16px;padding:12px 4px 8px}
.sheetopt{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg);color:var(--txt);font-family:var(--body);
  font-size:15px;font-weight:600;margin-bottom:8px;text-align:left}
.sheetopt .ic{font-size:20px}
.sheetopt.on{border-color:var(--violet);color:var(--violet)}
.sheet-handle{width:38px;height:4px;background:var(--line2);border-radius:2px;margin:8px auto 4px}
.overlay{position:fixed;inset:0;background:rgba(8,11,20,.72);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:14px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.overlay[hidden]{display:none}
.modal{width:100%;max-width:390px;background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.3);
  border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:11px;touch-action:pan-y}
.mtop{display:flex;align-items:center;gap:10px;min-width:0}
.mstar{background:none;border:none;padding:2px;line-height:0;flex-shrink:0}
.mtitles{min-width:0;flex:1}
.mtitle{font-family:var(--display);font-weight:700;font-size:17px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.mmeta{color:var(--muted);font-size:12.5px;margin-top:1px}
.mownedtag{font-size:11px;font-weight:600;color:var(--green);flex-shrink:0}
.imgzone{position:relative;display:flex;align-items:center}
.imgwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:230px;
  background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.imgwrap img{max-width:100%;max-height:58vh;display:block;border-radius:10px}
.imgstate{color:var(--muted);font-size:13px;text-align:center;padding:26px 14px;line-height:1.5}
.imgstate a{color:var(--gold)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:52px;
  display:flex;align-items:center;justify-content:center;background:rgba(21,27,44,.85);
  border:1px solid var(--line2);color:var(--txt);font-size:19px;border-radius:10px;z-index:2}
.nav.prev{left:6px}.nav.next{right:6px}
.nav:disabled{opacity:.25}
.mcounter{text-align:center;color:var(--dim);font-size:11.5px}
.btnrow{display:flex;gap:8px}
.btn{flex:1;padding:12px 10px;border-radius:12px;font-family:var(--body);font-size:14px;
  font-weight:600;text-align:center;text-decoration:none;border:1px solid var(--line2);
  color:var(--txt);background:none;display:block}
.btn.buy{background:var(--gold);border-color:var(--gold);color:#3A2A00}
.spinner{width:26px;height:26px;border:3px solid var(--line2);border-top-color:var(--gold);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="topbar">
  <button class="tcgpick" id="tcgPick"><span class="ic" id="tcgIcon">🔴</span> <span id="tcgName">Pokémon</span> <span style="color:var(--dim);font-size:11px">▾</span></button>
  <span class="vtag" id="vTag">v3.2</span>
  <button class="themebtn" id="privBtn" aria-label="Masquer les montants">👁</button>
  <button class="themebtn" id="themeBtn" aria-label="Basculer le thème">🌙</button>
</div>
<header style="padding:6px 16px 8px">
  <h1 style="font-size:23px" id="hTitle">La chasse aux <em>étoiles jaunes</em></h1>
  <p class="sub" id="hSub">Master sets AR / SAR / MUR.</p>
</header>

<section class="dash">
  <div class="bigline">
    <span class="bignum" id="ownedNum">0</span>
    <span class="muted" style="font-size:15px" id="totalTxt">/ 0 AR · 0%</span>
    <span class="saved" id="savedFlash">✓ sauvegardé</span>
  </div>
  <div class="track"><div class="fill gold" id="progFill" style="width:0%"></div></div>
  <div class="scopenote" id="scopeNote"></div>
  <div class="valueline">
    <span class="lbl">💎 Valeur de ta collection (cote)</span>
    <span class="val" id="collValue">0,00 €</span>
  </div>
  <div class="spentline">
    <span class="lbl">Dépensé au total</span>
    <span class="val" id="spentTxt">0,00 €</span>
  </div>
  <div class="refreshrow">
    <button class="refreshbtn" id="refreshBtn">↻ Actualiser les cotes</button>
  </div>
  <div class="refreshstatus" id="refreshStatus"></div>
  <div class="restpanel">
    <div class="resthead">Séries comptées (compteur + reste à acquérir)</div>
    <div id="restRows"></div>
    <div class="resttotal"><span>Total sélection</span><span class="amt" id="restTotal">0,00 €</span></div>
  </div>
</section>

<div class="filters">
  <select id="filterSeries" aria-label="Filtrer par série"></select>
  <select id="filterSet" aria-label="Filtrer par set"></select>
</div>

<main id="sets"></main>

<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modalBox" role="dialog" aria-modal="true">
    <div class="mtop">
      <button class="mstar" id="mStar" aria-label="Acquise / non acquise"></button>
      <div class="mtitles">
        <div class="mtitle" id="mName"></div>
        <div class="mmeta" id="mMeta"></div>
      </div>
      <span class="mownedtag" id="mOwned"></span>
    </div>
    <div class="imgzone">
      <button class="nav prev" id="mPrev" aria-label="Carte précédente">‹</button>
      <div class="imgwrap" id="mImg"><div class="spinner"></div></div>
      <button class="nav next" id="mNext" aria-label="Carte suivante">›</button>
    </div>
    <div class="mcounter" id="mCounter"></div>
    <div class="btnrow">
      <button class="btn" id="mClose">Fermer</button>
      <a class="btn buy" id="mBuy" target="_blank" rel="noopener">Acheter · Cardmarket</a>
    </div>
  </div>
</div>

/* ── TCGdex ── */
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
async function tcgdexSets(){
 let sets=null;
 try{const c=JSON.parse(localStorage.getItem('tcgdx-sets')||'null');
   if(c&&Date.now()-c.ts<6048e5)sets=c.sets;}catch(e){}
 if(!sets){
   const r=await fetch('https://api.tcgdex.net/v2/fr/sets');
   if(!r.ok)throw new Error('api');
   const full=await r.json();
   sets=full.map(s=>({id:s.id,name:s.name}));
   try{localStorage.setItem('tcgdx-sets',JSON.stringify({ts:Date.now(),sets}));}catch(e){}
 }
 return sets;
}
async function tcgdexResolveSet(setName,alts){
 const sets=await tcgdexSets();
 const cands=[setName].concat(alts||[]).filter(Boolean);
 /* passe 1 : correspondance exacte sur le nom OU l'identifiant TCGdex (ex: 'svp','mep') */
 for(const cand of cands){
   const t=norm(cand);
   const f=sets.find(s=>norm(s.name)===t||norm(s.id)===t);
   if(f)return f;
 }
 /* passe 2 : le nom du set TCGdex contient le candidat */
 for(const cand of cands){
   const t=norm(cand);
   const f=sets.find(s=>norm(s.name).includes(t));
   if(f)return f;
 }
 /* passe 3 : le candidat contient le nom du set (ex: 'Foudre Noire · Flamme Blanche' → 'Foudre Noire').
    Garde-fou : un candidat 'promo' ne doit jamais matcher un set non-promo (bug ME01) */
 for(const cand of cands){
   const t=norm(cand);
   const f=sets.find(s=>{
     const sn=norm(s.name);
     if(!sn||!t.includes(sn))return false;
     if(t.includes('promo')&&!sn.includes('promo'))return false;
     return true;
   });
   if(f)return f;
 }
 return null;
}
async function tcgdexSetFull(setId,lang){
 const r=await fetch('https://api.tcgdex.net/v2/'+(lang||'fr')+'/sets/'+setId);
 if(!r.ok)throw new Error('api');
 return await r.json();
}
async function tcgdexSetMeta(setId,lang){
 lang=lang||'fr';
 const ck='tcgdx-set4-'+lang+'-'+setId;

 }catch(e){}
 const d=await tcgdexSetFull(setId,lang);
 const meta={ts:Date.now(),serie:(d.serie&&d.serie.id)||null,
   cards:(d.cards||[]).map(c=>({l:c.localId,id:c.id,img:c.image||null}))};
 try{localStorage.setItem(ck,JSON.stringify(meta));}catch(e){}
 return meta;
}

/* Set combiné : cartes FR, images EN carte par carte pour les manquantes, + id de série */
const combinedCache={};
async function tcgdexSetCombined(setId){
 if(combinedCache[setId])return combinedCache[setId];
 const frM=await tcgdexSetMeta(setId,'fr');
 let cards=frM.cards,serie=frM.serie;
 if(cards.some(c=>!c.img)){
   try{
     const enM=await tcgdexSetMeta(setId,'en');
     serie=serie||enM.serie;
     cards=cards.map(c=>{
       if(c.img)return c;
       const hit=enM.cards.find(e=>numKey(e.l)===numKey(c.l));
       return hit&&hit.img?{...c,img:hit.img}:c;
     });
   }catch(e){}
 }
 const out={serie,cards};
 combinedCache[setId]=out;
 return out;
}
/* URL finale : base TCGdex (qualité ajoutée) ou URL directe collée par l'utilisateur */
function imgUrl(base,quality){
 return /\.(png|jpe?g|webp|gif)(\?|$)/i.test(base)?base:base+'/'+quality+'.webp';
}
/* URLs construites : schéma d'assets TCGdex + images officielles pokemon.com */
function candidateBases(setCode,setId,serie,localId){
 /* EXCLUS volontairement : pokemon.com ET les URLs TCGdex reconstruites.
    Ces deux sources renvoient un DOS DE CARTE au lieu d'une 404 quand le scan
    n'existe pas, ce qui bloque la chaîne de repli et affiche une fausse image.
    TCGdex n'est utilisé que via l'URL réellement référencée par son API. */
 const out=[];
 const n=parseInt(localId,10);
 const pid=setId?String(setId).toLowerCase():null;
 if(setCode&&!isNaN(n)){
   const code=String(setCode).toUpperCase().replace(/[^A-Z0-9]/g,'');
   const OFF={'MEP':'MEBSP','EVP':'SVP'};
   const codeOff=OFF[code]||code;
   const pad=String(n).padStart(3,'0');
   const lc=codeOff.toLowerCase();
   const short=lc.replace(/^([a-z]+)0(\d)$/,'$1$2');
   out.push('https://pkmncards.com/wp-content/uploads/'+lc+'_en_'+pad+'_std.jpg');
   out.push('https://pkmncards.com/wp-content/uploads/'+lc+'_en_'+pad+'_std.png');
   if(short!==lc){
     out.push('https://pkmncards.com/wp-content/uploads/'+short+'_en_'+pad+'_std.jpg');
     out.push('https://pkmncards.com/wp-content/uploads/'+short+'_en_'+pad+'_std.png');
   }
 }
 if(pid&&!isNaN(n)){
   out.push('https://images.pokemontcg.io/'+pid+'/'+n+'.png');
   const alt=pid.replace(/0(\d)/,'$1').replace(/\./g,'pt');
   if(alt!==pid)out.push('https://images.pokemontcg.io/'+alt+'/'+n+'.png');
 }
 return out;
}
/* Essaie une liste d'URLs sur un <img> jusqu'à la première qui charge */
function trySrcs(el,urls){
 let i=0;
 el.referrerPolicy='no-referrer';
 const next=()=>{
   if(i>=urls.length){el.onerror=null;el.removeAttribute('src');return;}
   el.onerror=next;
   el.src=urls[i++];
 };
 next();
}
async function findCardCandidates(set,num,card){
 /* Ordre : sources à 404 franc d'abord (pokemontcg.io, PkmnCards — images EN),
    puis TCGdex en dernier car il sert un DOS DE CARTE pour les scans manquants. */
 const bases=[],risky=[];
 if(root_.tcg==='riftbound'){if(card&&card.img)bases.push(card.img);return bases;}
 try{
   const found=set.tcgdexId?{id:set.tcgdexId}:await tcgdexResolveSet(set.name,set.alts);
   let hit=null,serie=null;
   if(found){
     set.tcgdexId=set.tcgdexId||found.id;
     const comb=await tcgdexSetCombined(found.id);
     serie=comb.serie;
     hit=comb.cards.find(x=>numKey(x.l)===numKey(num))||null;
   }
   if(card&&card.img&&bases.indexOf(card.img)<0)bases.push(card.img);
   if(hit&&hit.img&&bases.indexOf(hit.img)<0)bases.push(hit.img);
   candidateBases(set.id,set.tcgdexId,serie,hit?hit.l:num).forEach(b=>{if(bases.indexOf(b)<0)bases.push(b);});
 }catch(e){
   if(card&&card.img)risky.push(card.img);
 }
 const urls=[];
 bases.concat(risky).forEach(b=>{
   const hi=imgUrl(b,'high'),lo=imgUrl(b,'low');
   if(urls.indexOf(hi)<0)urls.push(hi);
   if(urls.indexOf(lo)<0)urls.push(lo);
 });
 return urls;
}
/* pokemon.com renvoie un DOS DE CARTE quand le scan manque : ces URLs ne doivent jamais
   être prioritaires ni mémorisées comme image définitive. */
function isRiskyImg(u){return typeof u==='string'&&/assets\d*\.pokemon\.com/i.test(u);}
function cleanNum(x){return String(x==null?'':x).trim();}

/* Numéros promo parfois non numériques ('SVP123', '2025-006') : clé de comparaison tolérante */
function numKey(x){const n=parseInt(x,10);return isNaN(n)?String(x||'').trim().toLowerCase():n;}

const thumbCache={};
async function hydrateThumbs(){
 const imgs=document.querySelectorAll('img.thumb[data-set][data-num]');
 if(root_.tcg==='riftbound'){
   imgs.forEach(el=>{
     const set=allSets().find(x=>x.id===el.dataset.set);if(!set)return;
     const c=cardsOf(set).find(x=>numKey(x.num)===numKey(el.dataset.num));
     if(c&&c.img){el.referrerPolicy='no-referrer';el.onerror=()=>el.classList.add('hide');el.src=c.img;}
   });
   return;
 }
 const bySets={};
 imgs.forEach(el=>{const s=el.dataset.set;(bySets[s]=bySets[s]||[]).push(el);});
 for(const setId in bySets){
   const set=allSets().find(x=>x.id===setId);
   if(!set)continue;
   try{
     if(!thumbCache[setId]){
       const resolved=set.tcgdexId?{id:set.tcgdexId}:await tcgdexResolveSet(set.name,set.alts);
       if(!resolved){thumbCache[setId]='none';continue;}
       set.tcgdexId=set.tcgdexId||resolved.id;
       thumbCache[setId]=await tcgdexSetCombined(resolved.id);
     }
     if(thumbCache[setId]==='none')continue;
     const comb=thumbCache[setId];
     bySets[setId].forEach(el=>{
       const stCard=cardsOf(set).find(c=>numKey(c.num)===numKey(el.dataset.num));
       const hit=comb.cards.find(x=>numKey(x.l)===numKey(el.dataset.num));
       const bases=[];
       if(stCard&&stCard.img)bases.push(stCard.img);
       if(hit&&hit.img&&bases.indexOf(hit.img)<0)bases.push(hit.img);
       candidateBases(set.id,set.tcgdexId,comb.serie,hit?hit.l:el.dataset.num).forEach(b=>{if(bases.indexOf(b)<0)bases.push(b);});
       const risky=[];
       const urls=bases.concat(risky).map(b=>imgUrl(b,'low')).filter((u,i,a)=>a.indexOf(u)===i);
       if(urls.length)trySrcs(el,urls);
     });
   }catch(e){}
 }
}

/* ── Fournisseur Riftbound : API Riftcodex (ouverte, sans clé) ── */
const RIFT_API='https://api.riftcodex.com';
function riftMatchesTab(c){
 const m=(c.metadata||{}), cl=(c.classification||{});
 const rar=norm(cl.rarity||'');
 if(state.tab==='MUR')return !!(m.overnumbered||m.signature);
 if(state.tab==='SAR')return !!m.alternate_art&&!(m.overnumbered||m.signature);
 return rar==='epic'&&!m.alternate_art&&!(m.overnumbered||m.signature);
}
async function riftFetchAllCards(setId,statusEl){
 const out=[];let page=1;
 for(;;){
   statusEl.textContent='Chargement des cartes… ('+out.length+')';
   const r=await fetch(RIFT_API+'/cards?set_id='+encodeURIComponent(setId)+'&page='+page+'&size=100');
   if(!r.ok)throw new Error('api');
   const d=await r.json();
   const items=Array.isArray(d)?d:(d.items||d.results||d.data||[]);
   if(!items.length)break;
   out.push(...items);
   const total=(d&&(d.total||d.count))||null;
   if(total&&out.length>=total)break;
   if(items.length<100)break;
   page++;
   if(page>30)break;
 }
 return out;
}
async function riftLoadSet(set,statusEl,btnEl){
 btnEl.disabled=true;
 try{
   statusEl.textContent='Connexion à Riftcodex…';
   const setId=set.riftId||set.id;
   const all=await riftFetchAllCards(setId,statusEl);
   if(!all.length){statusEl.textContent='Aucune carte trouvée pour ce set (identifiant '+setId+').';btnEl.disabled=false;return;}
   const sel=all.filter(riftMatchesTab);
   if(!sel.length){
     const groups={};
     all.forEach(c=>{const k=((c.classification||{}).rarity)||'?';(groups[k]=groups[k]||[]).push(c);});
     const keys=Object.keys(groups).filter(k=>k!=='?');
     ANALYSIS[set.id]={};
     keys.forEach(k=>{ANALYSIS[set.id][k]=groups[k].map(riftToCard);});
     statusEl.innerHTML='Aucune carte « '+TCG().tabRar[state.tab]+' » ici. Charger par rareté :'+
       keys.map(k=>`<button class="add" style="margin-top:6px" data-a="loadrar" data-r="${esc(k)}">Charger : ${esc(k)} (${groups[k].length})</button>`).join('');
     btnEl.disabled=false;return;
   }
   mergeFound(set,sel.map(riftToCard));
 }catch(e){
   statusEl.textContent='Échec (hors ligne ou API indisponible) — réessaie.';
   btnEl.disabled=false;
 }
}
function riftToCard(c){
 const media=c.media||{};
 return {num:String(c.collector_number||c.public_code||c.riftbound_id||''),
   name:c.name||'?',cote:null,img:media.image_url||null};
}

 btn.disabled=true;

/* ── Chargement automatique des AR d'un set vide ── */
const ANALYSIS={};
function mergeFound(set,found){
 const target=cardsOf(set);
 const sortKey=x=>{const n=parseInt(x,10);return isNaN(n)?1e9:n;};
 const sorted=found.slice().sort((a,b)=>sortKey(a.num)-sortKey(b.num)||String(a.num).localeCompare(String(b.num)));
 const existingNums=new Set(target.filter(c=>c.num).map(c=>numKey(c.num)));
 const merged=target.filter(c=>c.name||c.owned||c.price);
 sorted.forEach(f=>{
   if(!existingNums.has(numKey(f.num)))
     merged.push({id:set.id+'-'+(state.tab==='SAR'?'sar-':state.tab==='MUR'?'mur-':'')+f.num,num:f.num,name:f.name,img:f.img||null,
       cote:(f.cote!==null&&f.cote!==undefined)?Math.round(f.cote*100)/100:null,owned:false,price:''});
 });
 merged.sort((a,b)=>sortKey(a.num||'0')-sortKey(b.num||'0')||String(a.num).localeCompare(String(b.num)));
 const noteTxt=merged.length+' cartes · '+merged.filter(c=>c.img).length+' images référencées';
 if(state.tab==='SAR'){set.cardsSar=merged;set.noteSar=noteTxt;}
 else if(state.tab==='MUR'){set.cardsMur=merged;set.noteMur=noteTxt;}
 else{set.cards=merged;set.note=noteTxt;}
 persist();render();
}
async function loadSetAR(set,statusEl,btnEl){
 btnEl.disabled=true;
 try{
   statusEl.textContent='Recherche du set sur TCGdex…';
   const resolved=set.tcgdexId?{id:set.tcgdexId,name:set.name}:await tcgdexResolveSet(set.name,set.alts);
   if(!resolved){statusEl.textContent='Set introuvable sur TCGdex (pas encore référencé ?) — réessaie plus tard ou ajoute à la main.';btnEl.disabled=false;return;}
   set.tcgdexId=resolved.id;
   statusEl.textContent='Set TCGdex trouvé : '+(resolved.name||resolved.id)+' — récupération…';
   const full=await tcgdexSetFull(resolved.id);
   const official=(full.cardCount&&full.cardCount.official)||0;
   const briefs=(full.cards||[]);
   const secrets=briefs.filter(c=>parseInt(c.localId,10)>official);
   const pool=secrets.length?secrets:briefs;
   statusEl.textContent='Analyse de '+pool.length+' cartes…'+(pool.length>120?' (set volumineux, patience)':'');
   const analysis=[];
   const CHUNK=6;let done=0;
   for(let i=0;i<pool.length;i+=CHUNK){
     const batch=pool.slice(i,i+CHUNK);
     await Promise.all(batch.map(async b=>{
       try{
         const r=await fetch('https://api.tcgdex.net/v2/fr/cards/'+b.id);
         if(!r.ok)throw new Error();
         const d=await r.json();
         let img=d.image||null;
         if(!img){
           try{
             const r2=await fetch('https://api.tcgdex.net/v2/en/cards/'+b.id);
             if(r2.ok){const d2=await r2.json();if(d2.image)img=d2.image;}
           }catch(e2){}
         }
         analysis.push({num:String(b.localId),name:d.name||b.name||'?',
           cote:pickPrice(d.pricing),rarity:d.rarity||'?',img:img});
       }catch(e){}
       done++;
     }));
     statusEl.textContent='Analyse… '+done+'/'+pool.length;
   }
   const found=analysis.filter(a=>(state.tab==='MUR'?isMURRarity:state.tab==='SAR'?isSARRarity:isARRarity)(a.rarity));
   if(!found.length){
     const groups={};
     analysis.forEach(a=>{const k=a.rarity||'?';(groups[k]=groups[k]||[]).push(a);});
     const keys=Object.keys(groups).filter(k=>k!=='?');
     if(!keys.length){
       statusEl.textContent='Aucune carte analysable pour ce set — réessaie plus tard.';
       btnEl.disabled=false;return;
     }
     ANALYSIS[set.id]=groups;
     statusEl.innerHTML='Pas de rareté \u00ab '+TCG().tabRar[state.tab]+' \u00bb dans ce set (sets spéciaux = étiquettes différentes). Choisis quoi charger :'+
       keys.map(k=>`<button class="add" style="margin-top:6px" data-a="loadrar" data-r="${esc(k)}">Charger : ${esc(k)} (${groups[k].length} cartes)</button>`).join('');
     btnEl.disabled=false;return;
   }
   mergeFound(set,found);
 }catch(e){
   statusEl.textContent='Échec (hors ligne ?) — réessaie.';
   btnEl.disabled=false;
 }
}

let refreshing=false;
async function refreshPrices(){
 if(refreshing)return;
 if(root_.tcg==='riftbound'){
   document.getElementById('refreshStatus').textContent='Riftcodex ne fournit pas de cotes — saisis tes prix à la main dans le champ « payé € ».';
   return;
 }
 refreshing=true;
 const btn=document.getElementById('refreshBtn');
 const status=document.getElementById('refreshStatus');
 btn.disabled=true;
 let done=0,updated=0,failed=0;
 const targets=[];
 try{
   for(const set of allSets()){
     const named=set.cards.concat(set.cardsSar||[],set.cardsMur||[]).filter(c=>c.name&&c.num);
     if(!named.length)continue;
     status.textContent='Résolution du set '+set.id+'…';
     let resolved=null,cards=null;
     try{
       resolved=set.tcgdexId?{id:set.tcgdexId}:await tcgdexResolveSet(set.name,set.alts);
       if(resolved)cards=await tcgdexSetCards(resolved.id);
     }catch(e){}
     if(!resolved||!cards){failed+=named.length;continue;}
     for(const c of named){
       const hit=cards.find(x=>numKey(x.l)===numKey(c.num));
       if(hit&&hit.id)targets.push({card:c,tid:hit.id});
       else failed++;
     }
   }
   const total=targets.length;
   const CHUNK=6;
   for(let i=0;i<targets.length;i+=CHUNK){
     const batch=targets.slice(i,i+CHUNK);
     await Promise.all(batch.map(async t=>{
       try{
         const r=await fetch('https://api.tcgdex.net/v2/fr/cards/'+t.tid);
         if(!r.ok)throw new Error();
         const d=await r.json();
         const p=pickPrice(d.pricing);
         if(d.image&&!t.card.img&&!isRiskyImg(d.image))t.card.img=d.image;
         else if(!d.image&&!t.card.img){
           try{
             const r2=await fetch('https://api.tcgdex.net/v2/en/cards/'+t.tid);
             if(r2.ok){const d2=await r2.json();if(d2.image&&!isRiskyImg(d2.image))t.card.img=d2.image;}
           }catch(e2){}
         }
         if(p!==null){t.card.cote=Math.round(p*100)/100;updated++;}
         else failed++;
       }catch(e){failed++;}
       done++;
     }));
     status.textContent='Actualisation… '+done+'/'+total;
   }
   state.lastPriceUpdate=Date.now();
   persist();render();
   status.textContent=updated>0
     ? '✓ '+updated+' cotes mises à jour'+(failed?' · '+failed+' indisponibles':'')+' — '+new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
     : 'Aucun prix disponible via l\u2019API — anciennes cotes conservées.';
 }catch(e){
   status.textContent='Échec de l\u2019actualisation (hors ligne ?) — anciennes cotes conservées.';
 }
 btn.disabled=false;
 refreshing=false;
}

  root.appendChild(h);
  visibleSets.forEach(set=>{
   const isSV=sr.id==='SV';
   const cds=cardsOf(set);
   const got=cds.filter(c=>c.owned).length;
   const done=cds.length>0&&got===cds.length;
   const restCote=cds.filter(c=>typeof c.cote==='number'&&!c.owned).reduce((t,c)=>t+c.cote,0);
   const hasCotes=cds.some(c=>typeof c.cote==='number');
   const el=document.createElement('section');
   el.className='set'+(done?' done':'')+(set.counted===false?' off':'');
   const restTxt=hasCotes
     ? (restCote>0?'Pour compléter : ≈ '+eur(restCote):'Série complète ! 🎉')
     : '';
   const rowsHtml=cds.map((c,i)=>{
     const coteTxt=(typeof c.cote==='number')?('cote ≈ <b>'+eur(c.cote)+'</b>'):'cote n.c.';
     const nameBlock=c.name
       ? `<button class="cardinfo" data-a="view" data-c="${c.id}">
           <img class="thumb" data-set="${esc(set.id)}" data-num="${esc(c.num)}" alt="" loading="lazy">
           <div class="cardtext"><div class="cardname">${esc(c.name)}</div><div class="cardmeta">n°${esc(c.num)} · ${coteTxt}</div></div>
          </button>`
       : `<input class="nameedit" data-f="name" data-c="${c.id}" value="${esc(c.name)}" placeholder="AR ${i+1} — nom">`;
     return `<div class="row${c.owned?' owned':''}">
       <button class="starbtn" data-a="star" data-c="${c.id}" aria-label="basculer">${star(c.owned,22)}</button>
       ${nameBlock}
       ${root_.privacy
         ? `<span class="price pricehidden">•••</span>`
         : `<input class="price" type="number" inputmode="decimal" data-f="price" data-c="${c.id}" value="${esc(c.price)}" placeholder="payé €">`}
     </div>`;
   }).join('');
   const loader=`<button class="loadbtn" data-a="loadar">⤓ Charger la liste ${TCG().tabs[state.tab].split(' ').slice(1).join(' ')||state.tab} automatiquement</button>
     <p class="footnote" style="text-align:left;margin:6px 0 0" data-role="loadstatus"></p>`;
   el.innerHTML=`
    <button class="sethead" data-a="toggle" aria-expanded="${set.open}">
     <div style="min-width:0">
       <div style="display:flex;align-items:center;gap:8px"><span class="code${isSV?' sv':''}">${esc(set.id)}</span>${done?star(true,15):''}</div>
       <div class="setname">${esc(set.name)}</div>
       <div class="setmeta">${esc(set.date)} · ${esc(state.tab==='SAR'?(set.noteSar||'SAR — liste à charger'):state.tab==='MUR'?(set.noteMur||'MUR — liste à charger'):set.note)}</div>
       ${restTxt?`<div class="setrest${restCote>0?'':' zero'}">${restTxt}</div>`:''}
     </div>
     <div style="flex-shrink:0;text-align:right">
       <span class="cntpill${set.counted!==false?' on':''}" role="button" data-a="cnt">${set.counted!==false?'✓ compté':'✗ ignoré'}</span>
       <div class="setcount${got?' has':''}">${got}<small>/${cds.length}</small></div>
       <div class="toggletxt">${set.open?'replier \u25b2':'d\u00e9plier \u25bc'}</div>
     </div>
    </button>
    <div class="constellation">${cds.map(c=>`<button data-a="star" data-c="${c.id}" title="${esc(c.name||'?')}" aria-label="basculer">${star(c.owned,17)}</button>`).join('')}</div>
    ${set.open?`<div class="rows">${rowsHtml}
      ${cds.filter(c=>c.name).length===0?loader:''}
      <button class="add" data-a="add">+ Ajouter une AR</button>
      ${cds.filter(c=>c.name).length?`<button class="loadbtn" style="margin-top:6px" data-a="rescan">🔄 Rechercher les cartes manquantes</button>
       <p class="footnote" data-role="loadstatus" style="text-align:left;margin:6px 0 0"></p>`:''}
      ${cds.length?`<button class="add clearset" data-a="clearset">🗑 Vider ce set (pour recharger)</button>`:''}
    </div>`:''}`;
   el.addEventListener('click',ev=>{
     const b=ev.target.closest('[data-a]');if(!b)return;
     const a=b.dataset.a;
     if(a==='toggle'){set.open=!set.open;persist();render();}
     else if(a==='star'){const c=cardsOf(set).find(x=>x.id===b.dataset.c);if(c){c.owned=!c.owned;persist();render();}}
     else if(a==='view'){const c=cardsOf(set).find(x=>x.id===b.dataset.c);if(c)openCard(set,c);}
     else if(a==='add'){cardsOf(set).push({id:set.id+'-x'+Date.now(),num:'',name:'',cote:null,owned:false,price:''});persist();render();}
     else if(a==='cnt'){set.counted=(set.counted===false);persist();render();}
     else if(a==='clearset'){
       if(confirm('Vider toutes les cartes de '+set.id+' ? (étoiles et prix de ce set perdus, rechargement possible ensuite)')){
         if(state.tab==='SAR'){set.cardsSar=[];set.noteSar='';}else if(state.tab==='MUR'){set.cardsMur=[];set.noteMur='';}else{set.cards=[];set.note='liste à charger';}persist();render();
       }
     }
     else if(a==='loadar'){
       const st=el.querySelector('[data-role=loadstatus]');
       if(root_.tcg==='riftbound')riftLoadSet(set,st,b); else loadSetAR(set,st,b);
     }
     else if(a==='rescan'){
       const st=el.querySelector('[data-role=loadstatus]');
       bustSetCache(set);
       if(st)st.textContent='Relecture complète du set…';
       if(root_.tcg==='riftbound')riftLoadSet(set,st,b); else loadSetAR(set,st,b);
     }
     else if(a==='loadrar'){
       const groups=ANALYSIS[set.id]||{};
       const list=groups[b.dataset.r]||[];
       if(list.length)mergeFound(set,list);
     }
   });
   el.addEventListener('input',ev=>{
     const inp=ev.target.closest('[data-f]');if(!inp)return;
     const c=cardsOf(set).find(x=>x.id===inp.dataset.c);if(!c)return;
     c[inp.dataset.f]=inp.value;
     persist();
     if(inp.dataset.f==='price')renderDash();
   });
   root.appendChild(el);
  });
  if(state.filterSet==='all'){
   const disc=document.createElement('section');
   disc.className='set discover';
   disc.innerHTML=`<div style="padding:14px 14px 16px">
     <div class="setname">🔍 Prochain set</div>
     <div class="setmeta">Nouveau set sorti (ex: ME06 en novembre) ? Tape le bouton : il sera détecté et ajouté automatiquement, prêt à charger.</div>
     <button class="loadbtn" style="margin-top:10px" data-a="discover">Chercher les nouveaux sets de la série</button>
     <p class="footnote" data-role="discstatus" style="text-align:left;margin:8px 0 0"></p>
    </div>`;
   disc.addEventListener('click',ev=>{
     const b=ev.target.closest('[data-a]');if(!b)return;
     if(b.dataset.a==='discover'){
       const st=disc.querySelector('[data-role=discstatus]');
       if(root_.tcg==='riftbound')riftDiscover(sr,st,b); else discoverNewSets(sr,st,b);
     }else if(b.dataset.a==='addset'){
       const cand=(DISCOVER[sr.id]||{})[b.dataset.sid];
       if(cand)addDiscoveredSet(sr,cand);
     }
   });
   root.appendChild(disc);
  }
 });
 const reset=document.createElement('button');
 reset.className='add reset';
 reset.textContent='R\u00e9initialiser tout le tracker';
 reset.onclick=()=>{if(confirm('Tout effacer et recharger les listes d\u2019origine ?')){state=seed();persist();render();}};
 root.appendChild(reset);
 const note=document.createElement('p');
 note.className='footnote';
 note.textContent='\u00ab Charger la liste AR \u00bb identifie les Illustrations Rares d\u2019un set via TCGdex (rareté + nom + cote + image). Cotes indicatives \u2014 v\u00e9rifie avant achat.';
 root.appendChild(note);
 hydrateThumbs();
}

/* renderTabs met à jour les libellés (icône + texte) et l'état actif des boutons de nav.
   Les boutons sont résolus dynamiquement car créés plus bas dans le DOM. */
function renderTabs(){
 const T=TCG().tabs;
 [['tabAR','AR'],['tabSAR','SAR'],['tabMUR','MUR']].forEach(([id,key])=>{
   const b=document.getElementById(id);if(!b)return;
   const parts=T[key].split(' ');
   const ic=parts.shift();
   const lb=parts.join(' ')||key;
   const icEl=b.querySelector('.ic'), lbEl=b.querySelector('.lb');
   if(icEl)icEl.textContent=ic;
   if(lbEl)lbEl.textContent=lb;
   b.classList.toggle('on',state.tab===key);
 });
}

/* ── Barre de navigation en bas (les 3 collections) ── */
const tabbar=document.createElement('nav');
tabbar.className='tabbar';
tabbar.innerHTML='<div class="tabbar-in">'+
 '<button class="navbtn" id="tabAR"><span class="ic">⭐</span><span class="lb">AR</span></button>'+
 '<button class="navbtn" id="tabSAR"><span class="ic">✨</span><span class="lb">SAR</span></button>'+
 '<button class="navbtn" id="tabMUR"><span class="ic">🏆</span><span class="lb">MUR</span></button>'+
 '</div>';
document.body.appendChild(tabbar);
tabbar.addEventListener('click',e=>{
 const b=e.target.closest('.navbtn');if(!b)return;
 const key=b.id==='tabSAR'?'SAR':b.id==='tabMUR'?'MUR':'AR';
 if(state.tab!==key){state.tab=key;persist();render();window.scrollTo(0,0);}
});

/* ── Bottom sheet : choix du TCG ── */
const sheetBg=document.createElement('div');
sheetBg.className='sheet-bg';sheetBg.hidden=true;
sheetBg.innerHTML='<div class="sheet"><div class="sheet-handle"></div><h3>Choisir un TCG</h3><div id="tcgOpts"></div></div>';
document.body.appendChild(sheetBg);
function openTcgSheet(){
 const box=sheetBg.querySelector('#tcgOpts');
 box.innerHTML=Object.keys(TCGS).map(k=>
   '<button class="sheetopt '+(root_.tcg===k?'on':'')+'" data-tcg="'+k+'"><span class="ic">'+TCGS[k].icon+'</span>'+TCGS[k].name+(root_.tcg===k?' ✓':'')+'</button>').join('');
 sheetBg.hidden=false;
}
sheetBg.addEventListener('click',e=>{
 if(e.target===sheetBg){sheetBg.hidden=true;return;}
 const b=e.target.closest('[data-tcg]');
 if(b){switchTcg(b.dataset.tcg);sheetBg.hidden=true;}
});
function switchTcg(t){
 if(!TCGS[t]||root_.tcg===t)return;
 useTcg(t);ensurePromoSets();persist();render();window.scrollTo(0,0);
}
document.getElementById('tcgPick').onclick=openTcgSheet;

/* ── Thème clair / sombre ── */
function applyTheme(){
 document.documentElement.setAttribute('data-theme',root_.theme==='sombre'?'sombre':'clair');
 const b=document.getElementById('themeBtn');if(b)b.textContent=root_.theme==='sombre'?'☀️':'🌙';
 const meta=document.querySelector('meta[name=theme-color]');if(meta)meta.setAttribute('content',root_.theme==='sombre'?'#0E1220':'#F4F5F8');
}
document.getElementById('themeBtn').onclick=()=>{root_.theme=root_.theme==='sombre'?'clair':'sombre';applyTheme();persist();};
function applyPrivacy(){
 const b=document.getElementById('privBtn');
 if(b){b.textContent=root_.privacy?'🙈':'👁';
   b.setAttribute('aria-label',root_.privacy?'Afficher les montants':'Masquer les montants');
   b.classList.toggle('privon',root_.privacy);}
}
document.getElementById('privBtn').onclick=()=>{
 root_.privacy=!root_.privacy;applyPrivacy();persist();render();
};

/* ── En-tête dynamique selon le TCG ── */
function renderHeader(){
 document.getElementById('tcgIcon').textContent=TCG().icon;
 document.getElementById('tcgName').textContent=TCG().name;
 document.getElementById('hTitle').innerHTML=root_.tcg==='pokemon'?'La chasse aux <em>étoiles jaunes</em>':'Collection <em>Riftbound</em>';
 const T=TCG().tabs;
 document.getElementById('hSub').textContent='Master sets '+T.AR.replace(/^\S+\s/,'')+' / '+T.SAR.replace(/^\S+\s/,'')+' / '+T.MUR.replace(/^\S+\s/,'');
}

applyTheme();
render();
</script>
